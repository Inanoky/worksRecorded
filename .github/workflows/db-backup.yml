name: DB Backup (plain SQL)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Dump database through a direct or session connection
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          PGPORT: "5432"
          PGUSER: ${{ secrets.PG_USER }}
          PGDATABASE: ${{ secrets.PG_DATABASE }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGSSLMODE: require
        run: bash .github/scripts/db-backup.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backups/*.sql
          retention-days: 60
